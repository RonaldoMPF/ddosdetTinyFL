[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddosdetTinyFL"
version = "1.1.1"
description = "Multiclass DDoS Detection using Federated Learning and TinyML for EdgeML and/or Embedded Devices"
license = { file = "LICENSE" }
dependencies = [
    "flwr[simulation]>=1.28.0",
    "flwr-datasets>=0.6.0",
    "torch==2.8.0",
    "torchao>=0.17.0",
    "scikit-learn==1.7.1"
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.29.0"

[tool.flwr.app.components]
serverapp = "ddosdetTinyFL.server_app:app"
clientapp = "ddosdetTinyFL.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
num-partitions = 6
batch-size = 32
learning-rate = 0.001
local-epochs = 1
fraction-evaluate = 1.0