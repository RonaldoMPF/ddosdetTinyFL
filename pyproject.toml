[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddosdetTinyFL"
version = "1.1.1"
description = "Multiclass DDoS Detection using Federated Learning and TinyML for EdgeML and/or Embedded Devices"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
dependencies = [
    "flwr[simulation]>=1.29.0,<1.30.0",
    "flwr-datasets>=0.6.0,<0.7.0",
    "datasets>=3.0,<4.0",
    "torch>=2.8.0",
    "torchao>=0.13.0,<0.14.0",
    "scikit-learn==1.7.1",
    "psutil>=5.9.0,<8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.29.0"

[tool.flwr.app.components]
serverapp = "ddosdetTinyFL.main:app"
clientapp = "ddosdetTinyFL.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
num-partitions = 2
batch-size = 32
learning-rate = 0.001
local-epochs = 1
fraction-evaluate = 1.0